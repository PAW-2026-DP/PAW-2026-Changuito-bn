; docker-php-ext-enable xdebug ya agrega la línea zend_extension=xdebug.so
; en su propio conf.d/docker-php-ext-xdebug.ini — acá solo van las opciones,
; para no cargar la extensión dos veces.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.discover_client_host=true
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
