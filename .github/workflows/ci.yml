name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  tests:
    name: Tests y build
    runs-on: ubuntu-latest

    # Base de test para los tests de Integration (ver ConnectionFactory::forTests()
    # y reglas-testing.md: Infrastructure se testea contra una base real, no con mocks).
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: changuito_test
          MARIADB_USER: changuito
          MARIADB_PASSWORD: changuito
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, intl
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        uses: ramsey/composer-install@v3

      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_TEST_DATABASE: changuito_test
          DB_USERNAME: changuito
          DB_PASSWORD: changuito
        run: vendor/bin/phpunit --colors=always

      # Verifica que la imagen de deploy sigue armando. No se pushea nada acá:
      # el push a Artifact Registry ocurre recien al mergear a dev.
      - name: Build imagen de produccion (sin push)
        run: docker build --target production -f docker/php/Dockerfile .
