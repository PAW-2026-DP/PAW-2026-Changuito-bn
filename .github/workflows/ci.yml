name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  tests:
    name: Tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, intl
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        uses: ramsey/composer-install@v3

      - name: Run test suite
        run: vendor/bin/phpunit --colors=always

      # Verifica que la imagen de deploy sigue armando. No se pushea nada acá:
      # el push a Artifact Registry ocurre recien al mergear a dev.
      - name: Build imagen de produccion (sin push)
        run: docker build --target production -f docker/php/Dockerfile .
