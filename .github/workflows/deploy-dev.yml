name: Deploy DEV

on:
  push:
    branches: [dev]

# id-token: write es lo que permite el intercambio OIDC de Workload Identity
# Federation, sin ninguna clave de service account guardada en secrets.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, push y deploy a la VM de DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar contra GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image repo
        id: vars
        run: echo "image_repo=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/changuito" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}/app:dev
            ${{ steps.vars.outputs.image_repo }}/app:sha-${{ github.sha }}

      - name: Build y push imagen nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}/nginx:dev
            ${{ steps.vars.outputs.image_repo }}/nginx:sha-${{ github.sha }}

      # El usuario Linux que gcloud crea para esta conexion (derivado de la
      # cuenta que corre el runner) no es dueno de /opt/changuito, asi que no
      # puede escribir ahi directo. /tmp es escribible por cualquier usuario;
      # el paso siguiente lo mueve a destino con sudo.
      - name: Copiar docker-compose.dev.yml a la VM
        run: |
          gcloud compute scp deploy/docker-compose.dev.yml \
            ${{ secrets.GCP_VM_NAME }}:/tmp/docker-compose.yml \
            --zone ${{ secrets.GCP_VM_ZONE }} \
            --tunnel-through-iap

      # Las cuentas que gcloud crea via SSH key de metadata quedan con sudo
      # sin password por default en GCE, asi que todo el deploy corre con
      # sudo en vez de depender de permisos/grupos del usuario de turno.
      # Las credenciales de Artifact Registry (gcloud auth configure-docker)
      # quedan guardadas en el HOME del usuario que las corrio, asi que se
      # repiten aca dentro del mismo bloque sudo para que apliquen al mismo
      # contexto que hace el pull, en vez de asumir que ya estan disponibles.
      - name: Deploy en la VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone ${{ secrets.GCP_VM_ZONE }} \
            --tunnel-through-iap \
            --command "sudo mv /tmp/docker-compose.yml /opt/changuito/docker-compose.yml && \
              sudo bash -c 'gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet && \
                cd /opt/changuito && \
                sed -i \"/^IMAGE_TAG=/d\" .env && \
                echo \"IMAGE_TAG=sha-${{ github.sha }}\" >> .env && \
                docker compose pull && \
                docker compose up -d --remove-orphans && \
                docker image prune -f'"

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "http://${{ secrets.DEV_HOST }}/" | grep -q 'Hello, World!'
