# Compose del ambiente DEV: corre en la VM de Compute Engine, en /opt/changuito.
# Lo copia el workflow .github/workflows/deploy-dev.yml en cada deploy, asi que
# el repo es la unica fuente de verdad: no editar este archivo en la VM.
services:
  app:
    image: ${IMAGE_REPO}/app:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ${IMAGE_REPO}/nginx:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
